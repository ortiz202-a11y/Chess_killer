name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Print versions (debug)
        run: |
          ./gradlew --version
          java -version
          echo "=== wrapper ==="
          cat gradle/wrapper/gradle-wrapper.properties || true
          echo "=== settings.gradle ==="
          sed -n '1,220p' settings.gradle || true
          echo "=== root build.gradle ==="
          sed -n '1,260p' build.gradle || true
          echo "=== app/build.gradle ==="
          sed -n '1,320p' app/build.gradle || true

      - name: Build Debug APK (stacktrace)
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
